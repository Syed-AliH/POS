services:
  postgres:
    image: postgres:16-alpine
    container_name: mama-babi-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mama_babi
      POSTGRES_PASSWORD: mama_babi
      POSTGRES_DB: mama_babi_pos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mama_babi -d mama_babi_pos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
